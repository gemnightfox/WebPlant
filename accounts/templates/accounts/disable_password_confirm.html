{% extends 'base.html' %}
{% load static %}
{# Confirm disabling local password. Opened from email link; POST completes the action. #}

{% block css %}
<link rel="stylesheet" href="{% static 'account/base.css' %}">
<link rel="stylesheet" href="{% static 'account/login.css' %}">
<link rel="stylesheet" href="{% static 'accounts/delete_account.css' %}">
<link rel="stylesheet" href="{% static 'accounts/disable_password_confirm.css' %}">
{% endblock %}

{% block content %}
<div class="Account-card Account-card--disablePasswordConfirm">
  <a href="{% url 'accounts:dashboard' %}" class="Account-back">← Back to account dashboard</a>
  <h1 class="Account-title">Disable password</h1>
  <p class="Account-label Account-label--disablePasswordConfirm">
    Email: <strong>{{ user.email }}</strong>.
  </p>

  <form
    method="post"
    action="{{ request.path }}"
    class="Account-deleteForm"
    onsubmit="return confirm('Remove your local password? You will only be able to sign in with Google until you set a new password.');"
  >
    {% csrf_token %}
    <button type="submit" class="Account-submit Account-deleteConfirm Account-deleteConfirm--danger">Disable password</button>
  </form>
</div>
{% endblock %}
